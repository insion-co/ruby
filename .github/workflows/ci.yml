name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Lint
        run: bundle exec rake lint

      - name: Test
        run: bundle exec rake test

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: |
          mkdir -p pkg
          gem build Insion.gemspec --output "pkg/insion-$(ruby -e 'print Gem::Specification.load("Insion.gemspec").version').gem"

      - name: Verify package metadata and contents
        run: |
          ruby -rrubygems/package -r./lib/Insion/version -e '
            spec = Gem::Package.new(Dir["pkg/*.gem"].fetch(0)).spec
            abort "unexpected gem name" unless spec.name == "insion"
            abort "gem version does not match Insion::VERSION" unless spec.version.to_s == Insion::VERSION
            abort "missing MIT license" unless spec.licenses.include?("MIT")
            abort "unexpected homepage" unless spec.homepage == "https://insion.co/docs/sdks/ruby"
            abort "unexpected Ruby requirement" unless spec.required_ruby_version.to_s == ">= 3.3.0"
            abort "development files packaged" if spec.files.any? { |file| file.start_with?(".fern/", ".github/", "test/") }
            abort "entrypoint missing" unless spec.files.include?("lib/insion.rb")
            abort "license missing" unless spec.files.include?("LICENSE.md")
          '

      - name: Test packaged gem
        run: |
          gem install pkg/*.gem --install-dir /tmp/insion-gems --no-document
          GEM_HOME=/tmp/insion-gems ruby -e 'require "insion"; abort "Insion::Client missing" unless defined?(Insion::Client)'
